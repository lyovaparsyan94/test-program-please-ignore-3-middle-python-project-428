name: main

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: appdb
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/appdb
      APP_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: make install
      - run: make lint
      - run: make build
      - run: make test-api

      # Браузерные тесты Хекслета лежат в __tests__ и подкладываются проверкой
      # hexlet-check, а не хранятся в репозитории. Запускаем их только если каталог
      # реально есть — иначе шаг ничего не находит и падает не по делу.
      - name: Browser tests (if present)
        run: |
          if [ -d "__tests__" ]; then
            npx playwright install --with-deps chromium
            make start &
            # --retry с таймаутом вместо бесконечного цикла: если make start
            # в фоне упал, шаг завершится, а не будет крутиться до лимита раннера.
            curl -sf --retry 30 --retry-connrefused --retry-delay 1 "$APP_URL/api/cities" >/dev/null
            make test
          else
            echo "Каталог __tests__ отсутствует — браузерные тесты пропущены."
          fi
