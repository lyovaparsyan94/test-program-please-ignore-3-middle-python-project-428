[project]
name = "hexlet-code"
version = "0.1.0"
description = "Flight booking service backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "uvicorn>=0.52.4",
    "yoyo-migrations>=9.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
